app = "mysky-backend"
primary_region = "fra"

[build]

[env]
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/actuator/health"
  protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
