services:
  postgres:
    image: postgres:16-alpine
    container_name: mysky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mysky
      POSTGRES_USER: mysky
      POSTGRES_PASSWORD: mysky
    ports:
      - "5432:5432"
    volumes:
      - mysky_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysky -d mysky"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysky_pgdata:
