spring:
  application:
    name: mysky-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/mysky}
    username: ${DATABASE_USER:mysky}
    password: ${DATABASE_PASSWORD:mysky}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # NB: do not set hibernate.jdbc.time_zone — it shifts TIME (LocalTime) columns
    # like the work-schedule hours. TIMESTAMPTZ + OffsetDateTime carry their own
    # offset, so instants are preserved without it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Default 8089 because :8080 and :8081 are both taken by other local
  # projects (itip-team09 + cloudnative-bcs-group1 mongo-express)
  port: ${SERVER_PORT:8089}

mysky:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-needs-to-be-at-least-256-bits-long-yes-really}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    issuer: mysky-backend
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4000}
  admin:
    email: ${MYSKY_ADMIN_EMAIL:admin@mysky.ge}
    name: ${MYSKY_ADMIN_NAME:mysky admin}
    password: ${MYSKY_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    ge.mysky: DEBUG
